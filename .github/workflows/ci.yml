name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Compile sources and test suite
        run: python -m compileall -q src tests scripts
      - name: Execute unit and adversarial regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate baseline example
        run: python -m unitgraph_guard audit --candidate examples/baseline.json --policy examples/policy.json --fail-on high
      - name: Validate fail-closed security gate
        shell: python
        run: |
          import subprocess
          import sys
          cmd = [sys.executable, '-m', 'unitgraph_guard', 'compare', '--baseline', 'examples/baseline.json', '--candidate', 'examples/candidate-risky.json', '--policy', 'examples/policy.json', '--fail-on', 'high']
          result = subprocess.run(cmd, check=False, capture_output=True, text=True)
          if result.returncode != 2:
              raise SystemExit(f'expected security gate 2, received {result.returncode}; stderr={result.stderr}')
      - name: Check built Python wheel
        run: python -m pip wheel --no-deps . -w dist
